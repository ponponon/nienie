name: Release (macOS DMG + Android APK)

# 触发方式：
#   git tag v0.2.0 && git push origin v0.2.0        → 同时出 macOS DMG 与 Android APK，挂在同一个 Release
#   手动 Run workflow                                  → 可只跑其中一端，也可指定挂到某个已有 Release tag
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   macOS 签名：(CSC_LINK / CSC_KEY_PASSWORD) + (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_TEAM_ID)
#   Android 签名：(ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: '构建目标'
        required: true
        default: both
        type: choice
        options: [both, macos, android]
      arch:
        description: 'macOS 目标架构'
        required: true
        default: arm64
        type: choice
        options: [arm64, x64]
      release_tag:
        description: '挂到指定 Release tag（如 v0.1.0）；留空则只上传 artifact'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos-dmg:
    name: macOS · Build · Sign · Notarize
    if: github.event_name == 'push' || inputs.targets != 'android'
    # macos-15 是 Apple 芯片 runner；x64 请改用 macos-15-intel
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare App Store Connect API key
        env:
          RAW_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if printf '%s' "$RAW_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$RAW_KEY" > "$KEY_PATH"
          else
            printf '%s' "$RAW_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build DMG (esbuild + staging + sign + notarize)
        env:
          TARGET_ARCH: ${{ inputs.arch || 'arm64' }}
        run: node scripts/package-mac.mjs --arch="$TARGET_ARCH"

      - name: Verify signature, notarization and staple
        run: |
          set -euo pipefail
          APP=$(ls -d apps/desktop/dist-release/out/mac-*/Nienie.app)
          DMG=$(ls apps/desktop/dist-release/out/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nienie-macos-dmg
          path: |
            apps/desktop/dist-release/out/*.dmg
            apps/desktop/dist-release/out/*.sha256

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            apps/desktop/dist-release/out/*.dmg
            apps/desktop/dist-release/out/*.sha256

  android-apk:
    name: Android · Build · Sign APK/AAB
    if: github.event_name == 'push' || inputs.targets != 'macos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，APK 将以 debug 签名产出（不可用于正式分发）"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android/release.jks"
          cat > apps/mobile/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/android/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已写入 key.properties（alias=$KEY_ALIAS）"

      - name: Build release APK and AAB
        working-directory: apps/mobile
        run: |
          # 体积优化三件套：只编 arm64 + 代码混淆 + 分离调试符号
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols
          flutter build appbundle --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Verify signing and rename artifacts
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' apps/mobile/pubspec.yaml)
          echo "app version: $VERSION"
          APK=$(ls apps/mobile/build/app/outputs/flutter-apk/app-release.apk)
          AAB=$(ls apps/mobile/build/app/outputs/bundle/release/app-release.aab)
          APKSIGNER=$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          if grep -q 'Android Debug' /tmp/apk-certs.txt; then
            echo "::error::APK 仍是 debug 签名，请检查 Secrets 配置"
            exit 1
          fi
          mkdir -p apps/mobile/build/artifacts
          cp "$APK" "apps/mobile/build/artifacts/Nienie-v${VERSION}-android.apk"
          cp "$AAB" "apps/mobile/build/artifacts/Nienie-v${VERSION}-android.aab"
          shasum -a 256 apps/mobile/build/artifacts/*.apk apps/mobile/build/artifacts/*.aab | tee apps/mobile/build/artifacts/SHA256SUMS

      - name: Report artifact sizes
        run: |
          set -euo pipefail
          {
            echo "### Android 产物体积"
            echo ""
            echo "| 产物 | 体积 |"
            echo "| --- | --- |"
            for f in apps/mobile/build/artifacts/*.apk apps/mobile/build/artifacts/*.aab; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "- ABI：arm64-v8a（仅 64 位设备）"
            echo "- 优化：abiFilters 单 ABI + jniLibs 压缩 + Dart obfuscate + 符号分离"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh apps/mobile/build/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nienie-android
          path: |
            apps/mobile/build/artifacts/*
            apps/mobile/build/symbols/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            apps/mobile/build/artifacts/Nienie-*-android.apk
            apps/mobile/build/artifacts/Nienie-*-android.aab
            apps/mobile/build/artifacts/SHA256SUMS
