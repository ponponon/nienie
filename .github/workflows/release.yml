name: Release macOS DMG

# 触发方式：
#   git tag v0.2.0 && git push origin v0.2.0   → 自动出签名 + 公证的 DMG 并挂到 Release
#   或手动 Run workflow（可选 arm64 / x64）
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   CSC_LINK            Developer ID .p12 的 base64
#   CSC_KEY_PASSWORD    .p12 的密码
#   APPLE_API_KEY       AuthKey_XXXX.p8 内容（PEM，或 base64）
#   APPLE_API_KEY_ID    Key ID
#   APPLE_API_ISSUER    Issuer ID
#   APPLE_TEAM_ID       Team ID

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        default: arm64
        type: choice
        options: [arm64, x64]

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build · Sign · Notarize · Publish
    # macos-15 是 Apple 芯片 runner；x64 请改用 macos-15-intel
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare App Store Connect API key
        env:
          RAW_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if printf '%s' "$RAW_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$RAW_KEY" > "$KEY_PATH"
          else
            printf '%s' "$RAW_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build DMG (esbuild + staging + sign + notarize)
        env:
          TARGET_ARCH: ${{ inputs.arch || 'arm64' }}
        run: node scripts/package-mac.mjs --arch="$TARGET_ARCH"

      - name: Verify signature, notarization and staple
        run: |
          set -euo pipefail
          APP=$(ls -d apps/desktop/dist-release/out/mac-*/Nienie.app)
          DMG=$(ls apps/desktop/dist-release/out/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nienie-dmg
          path: |
            apps/desktop/dist-release/out/*.dmg
            apps/desktop/dist-release/out/*.sha256

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist-release/out/*.dmg
            apps/desktop/dist-release/out/*.sha256
          generate_release_notes: true
