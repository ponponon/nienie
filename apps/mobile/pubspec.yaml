name: nienie_mobile
description: Nienie mobile-first control console for local coding agents.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  lucide_icons_flutter: ^4.0.2
  mobile_scanner: ^7.5.0
  device_info_plus: ^11.0.0
  file_picker: ^11.0.3
  app_links: ^6.4.0
  flutter_markdown: ^0.7.7
  markdown: ^7.3.1
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/nienie-logo.png
