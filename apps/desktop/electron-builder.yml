appId: cn.quniv.nienie
productName: Nienie
copyright: Copyright © 2026 ponponon

directories:
  # 打包脚本 scripts/package-mac.mjs 先把 esbuild 产物 + @matrixai 运行时闭包
  # 真实拷贝（解引用 pnpm 符号链接）到 staging 目录，再由 electron-builder 打包
  app: dist-release/app
  output: dist-release/out
  buildResources: assets

files:
  - dist/**
  - assets/**
  - node_modules/**
  - package.json

# staging 的 node_modules 是打包脚本手工组装的（pnpm 符号链接已解引用），
# 不走 npm 安装，跳过原生模块重建
npmRebuild: false

# DMG 的压缩算法由 compression 决定（见 dmg-builder/out/dmg.js:127）：
#   normal(默认) → UDZO，zlib
#   maximum      → UDBZ，bzip2
# 实测同一份 Nienie.app：UDZO 137.2 MB → UDBZ 121.2 MB（省 11.7%），
# 代价是封装多约 20 秒、用户挂载多约 5 秒。签名/公证/staple 对 UDBZ 同样有效。
compression: maximum

# @matrixai/quic 的 napi 绑定必须以真实文件存在（dlopen 不走 asar），
# 整包 unpack 也规避 quiche.js 的 import.meta.url 相对定位
asarUnpack:
  - '**/node_modules/@matrixai/**'
  - '**/*.node'

mac:
  category: public.app-category.developer-tools
  icon: nienie.icns
  # 架构由 CLI 决定（package-mac.mjs 传 --arm64 / --x64），不在这里写死
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true

dmg:
  title: Nienie
  icon: nienie.icns
  # 默认 false；不签名的 DMG 会被 Gatekeeper 判为 "no usable signature"。
  # 顺序要求：先生成并签名 DMG → 再公证 → 再 staple（由 package-mac.mjs 的 [4/5] 完成）
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
